[supervisord]
logfile=/var/log/supervisord.log ; fichier de log principal
logfile_maxbytes=50MB        ; rotation des logs après 50 Mo
logfile_backups=10           ; garder 10 fichiers de backup
loglevel=info                ; niveau de log
pidfile=/var/run/supervisord.pid ; emplacement du fichier PID
nodaemon=true                ; indispensable pour que le conteneur Docker reste actif
user=root                    ; exécuter en tant que root pour gérer les services

[program:php-fpm]
command=php-fpm              ; commande pour démarrer PHP
stdout_logfile=/dev/stdout   ; rediriger les logs PHP directement dans Docker
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true             ; relancer automatiquement si crash
priority=5

[program:nginx]
command=nginx -g "daemon off;" ; commande pour démarrer Nginx au premier plan
stdout_logfile=/dev/stdout     ; rediriger les logs Nginx directement dans Docker
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true               ; relancer automatiquement si crash
priority=10
